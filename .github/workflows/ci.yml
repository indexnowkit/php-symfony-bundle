# CI of the read-only split repository indexnowkit/php-symfony-bundle. Development happens in
# https://github.com/indexnowkit/php (monorepo), whose CI covers all packages together.
# Between releases indexnowkit/core and indexnowkit/doctrine ^0.2 resolve to their main branches (0.2.x-dev),
# hence minimum-stability dev.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.3'
            deps: symfony64
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl
          coverage: none
      - run: composer config minimum-stability dev && composer config prefer-stable true
      - name: Install (highest)
        if: matrix.deps == 'highest'
        run: composer update --no-interaction --prefer-dist
      - name: Install (Symfony 6.4 / DBAL 3 / ORM 2)
        if: matrix.deps == 'symfony64'
        run: composer update --no-interaction --prefer-dist --with symfony/framework-bundle:^6.4 --with doctrine/dbal:^3.8 --with doctrine/orm:^2.19
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
